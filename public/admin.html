<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | World Ar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 58, 138, 0.88)), 
                  url('https://images.unsplash.com/photo-1581094288338-2314dddb7ece?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      color: #f8fafc; 
      padding: 20px; 
      min-height: 100vh; 
    }
    
    /* MODAL DE LOGIN (GLASSMORPHISM) */
    .login-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(12px); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 999; 
    }
    .login-card { 
      background: rgba(15, 23, 42, 0.65); 
      border: 1px solid rgba(56, 189, 248, 0.25); 
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(14, 165, 233, 0.15);
      padding: 35px 30px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 380px; 
      text-align: center; 
    }
    .login-card h3 { 
      margin-bottom: 22px; 
      color: #f8fafc; 
      font-size: 22px; 
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-card input { 
      width: 100%; 
      padding: 12px; 
      margin-bottom: 14px; 
      background: rgba(2, 6, 23, 0.6); 
      border: 1px solid rgba(56, 189, 248, 0.2); 
      border-radius: 8px; 
      color: #fff; 
      outline: none;
      transition: border-color 0.2s;
    }
    .login-card input:focus {
      border-color: #38bdf8;
    }
    .login-card button { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      border: none; 
      border-radius: 8px; 
      color: white; 
      font-weight: bold; 
      cursor: pointer; 
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-card button:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }
    .error-msg { color: #f87171; font-size: 12px; margin-top: 12px; display: none; }

    /* ESTRUTURA DO PAINEL */
    .container { max-width: 1100px; margin: 0 auto; display: none; }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding-bottom: 18px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
      margin-bottom: 24px; 
      flex-wrap: wrap; 
      gap: 12px; 
    }
    .header h2 {
      font-size: 24px;
      background: linear-gradient(90deg, #e0f2fe, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn { 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn:hover { 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.35);
    }
    .btn-secondary {
      background: rgba(30, 41, 59, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none !important;
    }
    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.9) !important;
    }
    .btn-logout { 
      background: linear-gradient(135deg, #ef4444, #dc2626); 
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }
    .btn-logout:hover { 
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.35);
    }
    .btn-delete { 
      background: rgba(239, 68, 68, 0.15); 
      color: #f87171; 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: bold; 
      margin-left: 6px; 
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: #ef4444;
      color: white;
    }

    /* BANNER E CARDS */
    .audio-banner { 
      background: rgba(14, 165, 233, 0.12); 
      border: 1px solid rgba(56, 189, 248, 0.3); 
      backdrop-filter: blur(8px);
      color: #7dd3fc; 
      padding: 12px 18px; 
      border-radius: 10px; 
      margin-bottom: 24px; 
      font-size: 13px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }
    .pulse-dot { 
      height: 8px; 
      width: 8px; 
      background-color: #38bdf8; 
      border-radius: 50%; 
      display: inline-block; 
      margin-right: 8px; 
      box-shadow: 0 0 10px #38bdf8; 
      animation: pulse 1.5s infinite; 
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 25px; }
    .card { 
      background: rgba(15, 23, 42, 0.6); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);
      padding: 20px; 
      border-radius: 14px; 
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .card-title { color: #94a3b8; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-value { font-size: 32px; font-weight: 800; margin-top: 6px; }
    
    .card-total .card-value { background: linear-gradient(90deg, #f8fafc, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .pending .card-value { background: linear-gradient(90deg, #fde047, #eab308); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .in-progress .card-value { background: linear-gradient(90deg, #38bdf8, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .completed .card-value { background: linear-gradient(90deg, #4ade80, #16a34a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* TABELA */
    .table-container { 
      background: rgba(15, 23, 42, 0.6); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);
      border-radius: 14px; 
      overflow-x: auto; 
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { 
      background: rgba(2, 6, 23, 0.5); 
      padding: 14px 16px; 
      color: #94a3b8; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    
    .badge { padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-pending { background: rgba(234, 179, 8, 0.15); color: #fde047; border: 1px solid rgba(234, 179, 8, 0.3); }
    .badge-progress { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.3); }
    .badge-completed { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    
    select { 
      background: rgba(2, 6, 23, 0.6); 
      color: #f8fafc; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      padding: 6px 10px; 
      border-radius: 6px; 
      outline: none;
    }
    select:focus { border-color: #38bdf8; }
    .actions-cell { display: flex; align-items: center; justify-content: center; gap: 6px; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h3>World Ar | Admin</h3>
      <input type="text" id="username" placeholder="Usuário">
      <input type="password" id="password" placeholder="Senha">
      <button onclick="handleLogin()">Entrar</button>
      <div id="errorMsg" class="error-msg">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <!-- CONTEÚDO DO PAINEL -->
  <div id="adminContent" class="container">
    <div class="header">
      <h2>Painel de Gerenciamento</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button onclick="playNotificationSound()" class="btn btn-secondary">🔔 Testar Som</button>
        <button onclick="loadTickets()" class="btn">Atualizar Lista</button>
        <button onclick="handleLogout()" class="btn btn-logout">Sair</button>
      </div>
    </div>

    <div class="audio-banner">
      <span><span class="pulse-dot"></span> Monitoramento em tempo real ativo</span>
    </div>

    <div class="cards-grid">
      <div class="card card-total"><div class="card-title">Total</div><div id="countTotal" class="card-value">0</div></div>
      <div class="card pending"><div class="card-title" style="color:#fde047">Pendentes</div><div id="countPending" class="card-value">0</div></div>
      <div class="card in-progress"><div class="card-title" style="color:#38bdf8">Em Andamento</div><div id="countInProgress" class="card-value">0</div></div>
      <div class="card completed"><div class="card-title" style="color:#4ade80">Concluídos</div><div id="countCompleted" class="card-value">0</div></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Serviço</th>
            <th>Observações</th>
            <th>Status</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="ticketsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    let previousTicketCount = null;

    function getAuthHeader() {
      const token = localStorage.getItem('adminToken');
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('adminToken', data.token);
          checkAuth();
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Erro ao realizar login.';
        errorMsg.style.display = 'block';
      }
    }

    function handleLogout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (token) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadTickets();
      } else {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('adminContent').style.display = 'none';
      }
    }

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function createBeep(freq, startTime, duration) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }
        const now = audioCtx.currentTime;
        createBeep(880, now, 0.15);
        createBeep(1200, now + 0.18, 0.3);
      } catch (e) {}
    }

    async function loadTickets() {
      try {
        const res = await fetch('/api/tickets', { headers: getAuthHeader() });
        
        if (res.status === 401 || res.status === 403) {
          handleLogout();
          return;
        }

        const tickets = await res.json();
        const tbody = document.getElementById('ticketsTable');

        if (previousTicketCount !== null && tickets.length > previousTicketCount) {
          playNotificationSound();
        }
        previousTicketCount = tickets.length;

        document.getElementById('countTotal').innerText = tickets.length;
        document.getElementById('countPending').innerText = tickets.filter(t => t.status === 'PENDING').length;
        document.getElementById('countInProgress').innerText = tickets.filter(t => t.status === 'IN_PROGRESS').length;
        document.getElementById('countCompleted').innerText = tickets.filter(t => t.status === 'COMPLETED').length;

        if (tickets.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #64748b;">Nenhum chamado encontrado.</td></tr>';
          return;
        }

        tbody.innerHTML = tickets.map(t => {
          let badge = '<span class="badge badge-pending">Pendente</span>';
          if (t.status === 'IN_PROGRESS') badge = '<span class="badge badge-progress">Em Andamento</span>';
          if (t.status === 'COMPLETED') badge = '<span class="badge badge-completed">Concluído</span>';

          return `
            <tr>
              <td>#${t.id}</td>
              <td style="font-weight: bold;">${t.clientName}</td>
              <td>${t.clientPhone}</td>
              <td>${t.address || '-'}</td>
              <td>${t.serviceType}</td>
              <td>${t.description || '-'}</td>
              <td>${badge}</td>
              <td>
                <div class="actions-cell">
                  <select onchange="updateStatus(${t.id}, this.value)">
                    <option value="" disabled selected>Alterar Status</option>
                    <option value="PENDING">Pendente</option>
                    <option value="IN_PROGRESS">Em Andamento</option>
                    <option value="COMPLETED">Concluído</option>
                  </select>
                  <button class="btn-delete" onclick="deleteTicket(${t.id})">Apagar</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    async function updateStatus(id, newStatus) {
      if (!newStatus) return;
      await fetch(`/api/tickets/${id}/status`, {
        method: 'PATCH',
        headers: getAuthHeader(),
        body: JSON.stringify({ status: newStatus })
      });
      loadTickets();
    }

    async function deleteTicket(id) {
      if (confirm(`Tem certeza que deseja apagar o chamado #${id}?`)) {
        await fetch(`/api/tickets/${id}`, { method: 'DELETE', headers: getAuthHeader() });
        loadTickets();
      }
    }

    checkAuth();
    setInterval(() => {
      if (localStorage.getItem('adminToken')) loadTickets();
    }, 10000);
  </script>
</body>
</html>

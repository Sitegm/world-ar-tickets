<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin | World Ar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
    
    /* MODAL DE LOGIN */
    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 999; }
    .login-card { background: #020617; border: 1px solid #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
    .login-card h3 { margin-bottom: 20px; color: #f8fafc; }
    .login-card input { width: 100%; padding: 10px; margin-bottom: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
    .login-card button { width: 100%; padding: 10px; background: #4f46e5; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
    .login-card button:hover { background: #4338ca; }
    .error-msg { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; }

    /* ESTRUTURA DO PAINEL */
    .container { max-width: 1100px; margin: 0 auto; display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .btn { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #4338ca; }
    .btn-logout { background: #ef4444; }
    .btn-logout:hover { background: #dc2626; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 6px; }

    /* BANNER E CARDS */
    .audio-banner { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: #93c5fd; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; }
    .pulse-dot { height: 8px; width: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: #020617; border: 1px solid #1e293b; padding: 15px; border-radius: 12px; }
    .card-title { color: #94a3b8; font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .card-value { font-size: 28px; font-weight: bold; margin-top: 5px; }
    .pending { color: #fbbf24; }
    .in-progress { color: #60a5fa; }
    .completed { color: #34d399; }
    
    /* TABELA */
    .table-container { background: #020617; border: 1px solid #1e293b; border-radius: 12px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #0f172a; padding: 12px; color: #94a3b8; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
    td { padding: 12px; border-bottom: 1px solid rgba(30, 41, 59, 0.5); }
    .badge { padding: 4px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; display: inline-block; }
    .badge-pending { background: #451a03; color: #fbbf24; border: 1px solid #78350f; }
    .badge-progress { background: #172554; color: #60a5fa; border: 1px solid #1e40af; }
    .badge-completed { background: #022c22; color: #34d399; border: 1px solid #065f46; }
    select { background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 5px; border-radius: 6px; }
    .actions-cell { display: flex; align-items: center; justify-content: center; gap: 4px; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h3>Acesso Restrito</h3>
      <input type="text" id="username" placeholder="Usuário">
      <input type="password" id="password" placeholder="Senha">
      <button onclick="handleLogin()">Entrar</button>
      <div id="errorMsg" class="error-msg">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <!-- CONTEÚDO DO PAINEL -->
  <div id="adminContent" class="container">
    <div class="header">
      <h2>Painel de Gerenciamento</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button onclick="playNotificationSound()" class="btn" style="background: #334155;">🔔 Testar Som</button>
        <button onclick="loadTickets()" class="btn">Atualizar Lista</button>
        <button onclick="handleLogout()" class="btn btn-logout">Sair</button>
      </div>
    </div>

    <div class="audio-banner">
      <span><span class="pulse-dot"></span> Monitoramento em tempo real ativo</span>
    </div>

    <div class="cards-grid">
      <div class="card"><div class="card-title">Total</div><div id="countTotal" class="card-value">0</div></div>
      <div class="card pending"><div class="card-title" style="color:#fbbf24">Pendentes</div><div id="countPending" class="card-value">0</div></div>
      <div class="card in-progress"><div class="card-title" style="color:#60a5fa">Em Andamento</div><div id="countInProgress" class="card-value">0</div></div>
      <div class="card completed"><div class="card-title" style="color:#34d399">Concluídos</div><div id="countCompleted" class="card-value">0</div></div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Telefone</th>
            <th>Endereço</th>
            <th>Serviço</th>
            <th>Observações</th>
            <th>Status</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="ticketsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    let previousTicketCount = null;

    function getAuthHeader() {
      const token = localStorage.getItem('adminToken');
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function handleLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok && data.token) {
          localStorage.setItem('adminToken', data.token);
          checkAuth();
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.innerText = 'Erro ao realizar login.';
        errorMsg.style.display = 'block';
      }
    }

    function handleLogout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    function checkAuth() {
      const token = localStorage.getItem('adminToken');
      if (token) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        loadTickets();
      } else {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('adminContent').style.display = 'none';
      }
    }

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function createBeep(freq, startTime, duration) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }
        const now = audioCtx.currentTime;
        createBeep(880, now, 0.15);
        createBeep(1200, now + 0.18, 0.3);
      } catch (e) {}
    }

    async function loadTickets() {
      try {
        const res = await fetch('/api/tickets', { headers: getAuthHeader() });
        
        if (res.status === 401 || res.status === 403) {
          handleLogout();
          return;
        }

        const tickets = await res.json();
        const tbody = document.getElementById('ticketsTable');

        if (previousTicketCount !== null && tickets.length > previousTicketCount) {
          playNotificationSound();
        }
        previousTicketCount = tickets.length;

        document.getElementById('countTotal').innerText = tickets.length;
        document.getElementById('countPending').innerText = tickets.filter(t => t.status === 'PENDING').length;
        document.getElementById('countInProgress').innerText = tickets.filter(t => t.status === 'IN_PROGRESS').length;
        document.getElementById('countCompleted').innerText = tickets.filter(t => t.status === 'COMPLETED').length;

        if (tickets.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #64748b;">Nenhum chamado encontrado.</td></tr>';
          return;
        }

        tbody.innerHTML = tickets.map(t => {
          let badge = '<span class="badge badge-pending">Pendente</span>';
          if (t.status === 'IN_PROGRESS') badge = '<span class="badge badge-progress">Em Andamento</span>';
          if (t.status === 'COMPLETED') badge = '<span class="badge badge-completed">Concluído</span>';

          return `
            <tr>
              <td>#${t.id}</td>
              <td style="font-weight: bold;">${t.clientName}</td>
              <td>${t.clientPhone}</td>
              <td>${t.address || '-'}</td>
              <td>${t.serviceType}</td>
              <td>${t.description || '-'}</td>
              <td>${badge}</td>
              <td>
                <div class="actions-cell">
                  <select onchange="updateStatus(${t.id}, this.value)">
                    <option value="" disabled selected>Alterar Status</option>
                    <option value="PENDING">Pendente</option>
                    <option value="IN_PROGRESS">Em Andamento</option>
                    <option value="COMPLETED">Concluído</option>
                  </select>
                  <button class="btn-delete" onclick="deleteTicket(${t.id})">Apagar</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    async function updateStatus(id, newStatus) {
      if (!newStatus) return;
      await fetch(`/api/tickets/${id}/status`, {
        method: 'PATCH',
        headers: getAuthHeader(),
        body: JSON.stringify({ status: newStatus })
      });
      loadTickets();
    }

    async function deleteTicket(id) {
      if (confirm(`Tem certeza que deseja apagar o chamado #${id}?`)) {
        await fetch(`/api/tickets/${id}`, { method: 'DELETE', headers: getAuthHeader() });
        loadTickets();
      }
    }

    checkAuth();
    setInterval(() => {
      if (localStorage.getItem('adminToken')) loadTickets();
    }, 10000);
  </script>
</body>
</html>

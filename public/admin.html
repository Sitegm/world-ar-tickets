<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Chamados World</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #0066cc; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h2>Painel de Chamados Registrados</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Data</th>
        <th>Cliente</th>
        <th>Telefone</th>
        <th>Endereço</th>
        <th>Serviço</th>
        <th>Descrição</th>
      </tr>
    </thead>
    <tbody id="ticketsTable">
    </tbody>
  </table>

  <script>
    async function loadTickets() {
      const res = await fetch('/api/tickets');
      const tickets = await res.json();
      const tbody = document.getElementById('ticketsTable');
      tbody.innerHTML = '';

      tickets.forEach(t => {
        const tr = document.createElement('tr');
        const dateFormatted = new Date(t.createdAt).toLocaleString('pt-BR');
        tr.innerHTML = `
          <td>${t.id}</td>
          <td>${dateFormatted}</td>
          <td>${t.clientName}</td>
          <td>${t.clientPhone}</td>
          <td>${t.address || '-'}</td>
          <td>${t.serviceType}</td>
          <td>${t.description || '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadTickets();
  </script>
</body>
</html>

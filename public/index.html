<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Climatização - Abrir Chamado</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; }
    button { background: #0066cc; color: #fff; padding: 12px; border: none; width: 100%; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Abrir Chamado Técnico</h2>
  <form id="ticketForm">
    <div class="form-group">
      <label for="clientName">Nome Completo:</label>
      <input type="text" id="clientName" required>
    </div>
    <div class="form-group">
      <label for="clientPhone">WhatsApp / Telefone:</label>
      <input type="text" id="clientPhone" required>
    </div>
    <div class="form-group">
      <label for="address">Endereço Completo:</label>
      <input type="text" id="address" placeholder="Rua, número, bairro e cidade" required>
    </div>
    <div class="form-group">
      <label for="serviceType">Tipo de Serviço:</label>
      <select id="serviceType" required>
        <option value="">Selecione...</option>
        <option value="Instalação">Instalação</option>
        <option value="Manutenção / Conserto">Manutenção / Conserto</option>
        <option value="Higienização">Higienização</option>
      </select>
    </div>
    <div class="form-group">
      <label for="description">Descrição do Problema:</label>
      <textarea id="description" rows="4"></textarea>
    </div>
    <button type="submit">Enviar Chamado</button>
  </form>

  <script>
    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        address: document.getElementById('address').value,
        serviceType: document.getElementById('serviceType').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/tickets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('Chamado aberto com sucesso!');
        document.getElementById('ticketForm').reset();
      } else {
        alert('Erro ao abrir chamado.');
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Climatização - Abrir Chamado Técnico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 550px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc); color: #fff; padding: 30px 20px; text-align: center; }
    .header h1 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }
    .header p { font-size: 14px; opacity: 0.9; }
    form { padding: 30px 25px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #444; }
    input, select, textarea { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; transition: border-color 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: #0052d4; outline: none; }
    button { background: #0052d4; color: #ffffff; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #003ab7; }
    .footer { text-align: center; padding: 15px; font-size: 12px; color: #777; background: #fafafa; border-top: 1px solid #eee; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>World Climatização</h1>
      <p>Abertura de Chamado Técnico</p>
    </div>

    <form id="ticketForm">
      <div class="form-group">
        <label for="clientName">Nome Completo</label>
        <input type="text" id="clientName" placeholder="Digite seu nome" required>
      </div>

      <div class="form-group">
        <label for="clientPhone">WhatsApp / Telefone</label>
        <input type="tel" id="clientPhone" placeholder="(00) 00000-0000" required>
      </div>

      <div class="form-group">
        <label for="address">Endereço Completo</label>
        <input type="text" id="address" placeholder="Rua, número, bairro e cidade" required>
      </div>

      <div class="form-group">
        <label for="serviceType">Tipo de Serviço</label>
        <select id="serviceType" required>
          <option value="">Selecione o serviço...</option>
          <option value="Instalação">Instalação</option>
          <option value="Manutenção / Conserto">Manutenção / Conserto</option>
          <option value="Higienização">Higienização</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Descrição do Problema</label>
        <textarea id="description" rows="4" placeholder="Descreva brevemente o que está acontecendo..."></textarea>
      </div>

      <button type="submit">Enviar Chamado</button>
    </form>

    <div class="footer">
      World Climatização — Mais de 30 anos de excelência
    </div>
  </div>

  <script>
    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        clientName: document.getElementById('clientName').value,
        clientPhone: document.getElementById('clientPhone').value,
        address: document.getElementById('address').value,
        serviceType: document.getElementById('serviceType').value,
        description: document.getElementById('description').value
      };

      try {
        const res = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Chamado aberto com sucesso! Nossa equipe entrará em contato.');
          document.getElementById('ticketForm').reset();
        } else {
          alert('Erro ao enviar o chamado. Tente novamente.');
        }
      } catch (err) {
        alert('Erro de conexão com o servidor.');
      }
    });
  </script>
</body>
</html>
